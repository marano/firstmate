name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# TESTS NOT RUN BY DEFAULT, HERE AND LOCALLY. bin/fm-test-run.sh owns one table
# of default exclusions (`bin/fm-test-run.sh --list-default-exclusions` prints
# it, each with its reason) and every lane below inherits it, so CI and a local
# run cannot drift apart. A green run does NOT vouch for those tests: the
# secondmate and real-herdr-gated families, and the Pi, unused-harness and
# unused-backend scripts. The files stay in the repository and run on demand
# (`bin/fm-test-run.sh tests/fm-backend-orca.test.sh`, or `--include-excluded`).
# The "Prove exclusions" step of the timing aggregate job checks the table
# against what the run actually recorded: it reds naming any excluded script
# that ran and any other script that did not. Measurement and reasoning: the
# unused-capability audit, scenario C.

# Per-PR supersession: a new push to the same PR replaces that PR's in-flight
# CI instead of letting superseded heads keep 13 jobs of hosted-runner work.
# The group uses the PR number for pull_request events, so every run of one PR
# shares a group, and falls back to the unique run id for push events, so each
# main push gets its own group and is never cancelled. Cancellation is likewise
# limited to pull_request events. Evidence and rationale: the September 12
# Actions starvation report, section 3 "Workflow mechanics to ship first".
# The compliance workflow deliberately keeps its own event-specific groups; do
# not collapse it onto this simpler shape.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Hang tripwire only: lint executions measured at 14-16 minutes in the
    # September 12 starvation report, so this leaves deliberate margin.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/fm-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install pinned actionlint
        run: |
          set -eu
          bin/fm-install-actionlint.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Single owner of the lint definition (shell file set, config, version,
      # and GitHub workflow lint). Do not re-spell the checks here; keep CI
      # and the pre-push gate on this script so a self-broken ci.yml still
      # fails locally before merge.
      - id: lint
        run: bin/fm-lint.sh
      # Only when the lint itself failed: this job's log tail is what a
      # CI-repair agent reads, so tell it how to verify a repair cheaply.
      - name: How to verify a Lint repair locally
        if: failure() && steps.lint.outcome == 'failure'
        run: bin/fm-lint-repair-note.sh

  # Deterministic proof that portable parallel shards + portable serial + Herdr
  # equal the complete tests/*.test.sh inventory with no missing or duplicates,
  # and that the portable serial CI shards partition that serial lane exactly.
  test-coverage:
    name: Test coverage guard
    runs-on: ubuntu-latest
    # Hang tripwire: the coverage guard is a seconds-long local computation.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Prove complete regression partition
        run: bin/fm-test-run.sh --check-coverage

  # Three duration-balanced portable parallel shards of the Phase 2
  # proven-isolated set only. Composition owner: bin/fm-test-run.sh
  # (docs/fm-test-portable-shards.md). Split from two lanes to three on
  # 2026-09-17 by captain decision: the two-lane packing had no rebalance left
  # to spend (8.34/8.27 min against this 10-minute cap), so cutting wall-clock
  # merge wait required more lanes rather than more headroom or a higher cap.
  # tests/fm-captain-hold-lifecycle.test.sh alone (339763ms) exceeds an even
  # three-way split of the total, so shard 3 is that single script and a
  # fourth lane would not lower the packed max further.
  tests-portable-parallel-1:
    name: Behavior portable parallel 1
    runs-on: ubuntu-latest
    # This cap is intended as a hang tripwire. The three-way split measured
    # 328865/328538/339763ms (about 5.5-5.7 min) of packed hint weight against
    # this 10-minute cap on 2026-09-17, leaving about 43% headroom on the
    # heaviest lane; the prior two-lane split ran 8.27-8.34 min with almost no
    # margin left to rebalance.
    # Compare it with the derived hints from fm-test-run.sh --check-coverage
    # and completed job timings, allowing for setup and runner-speed spread.
    # A packed hint sum is not a measured job wall time or proof of headroom.
    # Evidence and refresh procedure: docs/fm-test-portable-shards.md.
    # Changes to this cap or the lane count require a separate scope decision.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/fm-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install pinned actionlint
        run: |
          set -eu
          bin/fm-install-actionlint.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install tasks-axi
        run: |
          set -eu
          npm install -g tasks-axi
          tasks-axi --version
      - name: Run portable parallel shard 1
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/fm-test"
          # The job cap is this lane's hang tripwire, so it keeps the runner
          # unbounded per script; the runner's default bound is for local runs.
          bin/fm-test-run.sh --lane portable-parallel-1 --per-script-timeout-secs 0 \
            --fail-on-gate-skip 'Pi extension typecheck prerequisite not found' \
            --json "$RUNNER_TEMP/fm-test/fm-test-timing-portable-parallel-1.json"
      - name: Upload shard 1 timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm-test-timing-portable-parallel-1
          path: ${{ runner.temp }}/fm-test/fm-test-timing-portable-parallel-1.json
          if-no-files-found: warn

  tests-portable-parallel-2:
    name: Behavior portable parallel 2
    runs-on: ubuntu-latest
    # Same timeout rationale as portable parallel shard 1 above.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/fm-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install pinned actionlint
        run: |
          set -eu
          bin/fm-install-actionlint.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install tasks-axi
        run: |
          set -eu
          npm install -g tasks-axi
          tasks-axi --version
      - name: Run portable parallel shard 2
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/fm-test"
          # Unbounded per script for the same reason as shard 1.
          bin/fm-test-run.sh --lane portable-parallel-2 --per-script-timeout-secs 0 \
            --json "$RUNNER_TEMP/fm-test/fm-test-timing-portable-parallel-2.json"
      - name: Upload shard 2 timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm-test-timing-portable-parallel-2
          path: ${{ runner.temp }}/fm-test/fm-test-timing-portable-parallel-2.json
          if-no-files-found: warn

  tests-portable-parallel-3:
    name: Behavior portable parallel 3
    runs-on: ubuntu-latest
    # Same timeout rationale as portable parallel shard 1 above. This shard is
    # tests/fm-captain-hold-lifecycle.test.sh alone: LPT packing places the
    # single dominant script by itself once splitting it further would not
    # lower any lane's packed weight.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/fm-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install pinned actionlint
        run: |
          set -eu
          bin/fm-install-actionlint.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install tasks-axi
        run: |
          set -eu
          npm install -g tasks-axi
          tasks-axi --version
      - name: Run portable parallel shard 3
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/fm-test"
          # Unbounded per script for the same reason as shard 1.
          bin/fm-test-run.sh --lane portable-parallel-3 --per-script-timeout-secs 0 \
            --json "$RUNNER_TEMP/fm-test/fm-test-timing-portable-parallel-3.json"
      - name: Upload shard 3 timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm-test-timing-portable-parallel-3
          path: ${{ runner.temp }}/fm-test/fm-test-timing-portable-parallel-3.json
          if-no-files-found: warn

  # Required portable serial remainder: watcher, lock, AFK, tmux, daemon,
  # ambiguous, and other stateful tests. Real Herdr stays in tests-herdr.
  # Split across separate runners so no two of these stateful scripts ever share
  # a machine: each shard is still strictly serial in itself. Shard membership
  # and the shard count both belong to bin/fm-test-run.sh, which refuses a lane
  # whose "ofN" disagrees with it (docs/fm-test-portable-shards.md).
  tests-portable-serial:
    name: Behavior portable serial ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # Current runners can take ~21 min for a balanced shard. This 30-minute cap
    # preserves the timeout as a hang tripwire while allowing runner-speed and
    # job-setup margin; it is not the expected healthy end of the lane.
    # Answer a shard that outgrows this by re-sharding, not by raising the cap:
    # bin/fm-test-run.sh derives PORTABLE_SERIAL_MAX_SHARD_MS from this number
    # and refuses the packed weight there, seconds into the coverage guard,
    # rather than half an hour into a job that is then killed with no verdict.
    timeout-minutes: 30
    strategy:
      # Every shard reports so one failure never hides another shard's result.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/fm-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install pinned actionlint
        run: |
          set -eu
          bin/fm-install-actionlint.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Require tmux for e2e tests
        run: |
          set -eu
          command -v tmux >/dev/null || {
            echo "::error::tmux is required for real afk injection e2e coverage"
            exit 1
          }
          tmux -V
      - name: Install tasks-axi for backlog-handoff delegation
        run: |
          set -eu
          npm install -g tasks-axi
          tasks-axi --version
      - name: Run portable serial shard ${{ matrix.shard }}
        env:
          # job-total rather than a literal, so shrinking or growing the matrix
          # without matching bin/fm-test-run.sh is refused instead of quietly
          # leaving a shard of the required lane unrun.
          FM_SERIAL_LANE: portable-serial-${{ matrix.shard }}of${{ strategy.job-total }}
          FM_SERIAL_SHARD: ${{ matrix.shard }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/fm-test"
          # CI provides npm and tsc, so
          # any missing typecheck prerequisite is a broken lane, not a valid skip.
          # The job cap is this lane's hang tripwire, so it keeps the runner
          # unbounded per script; the runner's default bound is for local runs.
          bin/fm-test-run.sh --lane "$FM_SERIAL_LANE" --per-script-timeout-secs 0 \
            --fail-on-gate-skip 'Pi extension typecheck prerequisite not found' \
            --json "$RUNNER_TEMP/fm-test/fm-test-timing-portable-serial-${FM_SERIAL_SHARD}.json"
      - name: Upload portable serial shard ${{ matrix.shard }} timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm-test-timing-portable-serial-${{ matrix.shard }}
          path: ${{ runner.temp }}/fm-test/fm-test-timing-portable-serial-${{ matrix.shard }}.json
          if-no-files-found: warn

  # Required real-Herdr lane: pinned install, serial real-herdr-gated family,
  # hard-fail on "skip: herdr not found". Starts on Linux x86_64; if a genuine
  # platform invariant fails (focus, cleanup, default-session tripwire), keep
  # the failure evidence and move the job to macOS rather than skip assertions.
  # SWITCHED OFF: unless the repository variable FM_CI_RUN_HERDR is 'true' this
  # job is skipped, and the run shows it as skipped rather than absent. The
  # family is also in the runner's default exclusions; this job names it with
  # --family, which always runs it, so setting the variable is the only step.
  tests-herdr:
    name: Behavior tests (Herdr)
    if: ${{ vars.FM_CI_RUN_HERDR == 'true' }}
    runs-on: ubuntu-latest
    # Healthy runs finish around 7 minutes. This job cap is a last-resort hang
    # tripwire, not the expected end of the lane. The family-run step owns the
    # tighter bound so a wedged suite fails fast with always() cleanup and
    # timing artifacts still uploaded (docs/fm-test-portable-shards.md).
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require tools for real Herdr
        run: |
          set -eu
          command -v jq >/dev/null || { echo "::error::jq is required"; exit 1; }
          command -v python3 >/dev/null || { echo "::error::python3 is required"; exit 1; }
          command -v curl >/dev/null || { echo "::error::curl is required"; exit 1; }
          command -v tar >/dev/null || { echo "::error::tar is required"; exit 1; }
          jq --version
          python3 --version
      - name: Install pinned Herdr
        run: |
          set -eu
          bin/fm-install-herdr.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install pinned Treehouse
        run: |
          set -eu
          # Several real-herdr-gated E2E scripts require treehouse for spawn
          # worktree acquisition (presentation, workspace-per-home, autodetect).
          bin/fm-install-treehouse.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Assert Herdr pin and protocol floor
        run: |
          set -eu
          command -v herdr >/dev/null || { echo "::error::herdr not on PATH after install"; exit 1; }
          command -v treehouse >/dev/null || { echo "::error::treehouse not on PATH after install"; exit 1; }
          herdr --version
          treehouse --version
          status=$(herdr status --json)
          printf '%s\n' "$status"
          version=$(printf '%s' "$status" | jq -r '.client.version // empty')
          protocol=$(printf '%s' "$status" | jq -r '.client.protocol // empty')
          [ "$version" = "0.7.4" ] || {
            echo "::error::expected exact Herdr pin 0.7.4, got ${version:-<empty>}"
            exit 1
          }
          case "$protocol" in
            ''|*[!0-9]*) echo "::error::could not read client protocol"; exit 1 ;;
          esac
          [ "$protocol" -ge 16 ] || {
            echo "::error::herdr protocol $protocol is below the required floor 16"
            exit 1
          }
      - name: Start default Herdr session for fleet-state tripwire
        run: |
          set -eu
          # Lab provision requires exactly one running default session so the
          # default-session tripwire can arm. Start it headless; never use it
          # for lab work (tests still refuse default and use fm-lab-* only).
          mkdir -p "$RUNNER_TEMP/fm-herdr"
          nohup herdr server >"$RUNNER_TEMP/fm-herdr/default-server.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/fm-herdr/default-server.pid"
          attempt=0
          while [ "$attempt" -lt 150 ]; do
            running=$(herdr status --json 2>/dev/null | jq -r '.server.running // false' || echo false)
            if [ "$running" = true ]; then
              herdr session list --json | jq -e '
                [.sessions[]? | select(.default == true and .name == "default" and .running == true)]
                | length == 1
              ' >/dev/null
              echo "default Herdr session is running"
              exit 0
            fi
            sleep 0.2
            attempt=$((attempt + 1))
          done
          echo "::error::default Herdr server did not become ready"
          cat "$RUNNER_TEMP/fm-herdr/default-server.log" || true
          exit 1
      - name: Snapshot pre-suite Herdr sessions
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/fm-herdr"
          bin/fm-herdr-ci-cleanup.sh snapshot "$RUNNER_TEMP/fm-herdr/sessions-before.json"
      - name: Run real-Herdr family (serial, required)
        # Comfortably above the ~7 min healthy wall and far below the 75 min
        # job backstop. A hang must fail this step so cleanup still runs.
        timeout-minutes: 20
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/fm-test"
          # Serial only. Fail if any script reports herdr not found. Live
          # harness credential tests stay outside this family (opt-in env only).
          # The step timeout above is this lane's hang tripwire, so it keeps
          # the runner unbounded per script.
          bin/fm-test-run.sh --family real-herdr-gated --per-script-timeout-secs 0 \
            --fail-on-gate-skip 'herdr not found' \
            --json "$RUNNER_TEMP/fm-test/fm-test-timing-herdr.json"
      - name: Cleanup job-owned Herdr lab sessions
        if: always()
        run: |
          set -eu
          bin/fm-herdr-ci-cleanup.sh teardown "$RUNNER_TEMP/fm-herdr/sessions-before.json" || {
            echo "::warning::lab session cleanup reported a problem; see logs"
            # Surface diagnostics without weakening the suite result above.
            herdr session list --json || true
            exit 1
          }
      - name: Upload Herdr timing and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm-test-timing-herdr
          path: |
            ${{ runner.temp }}/fm-test/fm-test-timing-herdr.json
            ${{ runner.temp }}/fm-herdr/sessions-before.json
            ${{ runner.temp }}/fm-herdr/default-server.log
          if-no-files-found: warn

  # Aggregate per-lane timing into one summary artifact for critical-path review.
  tests-timing-aggregate:
    name: Behavior timing aggregate
    runs-on: ubuntu-latest
    # Hang tripwire: aggregation is seconds of work over lane artifacts.
    timeout-minutes: 5
    needs:
      - tests-portable-parallel-1
      - tests-portable-parallel-2
      - tests-portable-parallel-3
      - tests-portable-serial
      - tests-herdr
    if: always()
    steps:
      - uses: actions/checkout@v6
      - name: Download lane timing artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fm-test-timing-*
          path: ${{ runner.temp }}/fm-test-aggregate
          merge-multiple: true
      - name: Build aggregate timing summary
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/fm-test"
          shopt -s nullglob
          inputs=("$RUNNER_TEMP"/fm-test-aggregate/fm-test-timing-*.json)
          if [ "${#inputs[@]}" -eq 0 ]; then
            echo "::warning::no per-lane timing JSON found to aggregate"
            exit 0
          fi
          bin/fm-test-run.sh --aggregate-json \
            "$RUNNER_TEMP/fm-test/fm-test-timing-aggregate.json" \
            "${inputs[@]}"
      # Prove the default exclusions from what the run recorded, not from any
      # text: a misspelled name excludes nothing, and a mistaken one drops a
      # script nobody named. Runs on pull requests too.
      - name: Prove exclusions against the recorded timings
        if: success()
        run: |
          set -eu
          [ -f "$RUNNER_TEMP/fm-test/fm-test-timing-aggregate.json" ] || {
            echo "::error::no aggregate timing to prove the exclusions against"
            exit 1
          }
          bin/fm-test-run.sh --check-exclusions \
            "$RUNNER_TEMP/fm-test/fm-test-timing-aggregate.json" | tee "$RUNNER_TEMP/fm-test/exclusions.txt"
          {
            echo "### Tests NOT run by default"
            echo
            echo "A green run does not vouch for these (bin/fm-test-run.sh --list-default-exclusions):"
            echo
            echo '```'
            bin/fm-test-run.sh --list-default-exclusions | cut -f1
            echo
            cat "$RUNNER_TEMP/fm-test/exclusions.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Serial shard balance rots as tests grow (docs/fm-test-portable-shards.md).
      # This runs on pull requests as well as main. The per-script comparison it
      # replaced could not: a script's measured duration depends on which shard
      # packs it, so a branch's numbers were never main's. What this checks -
      # each shard's measured total against the job cap, and the lane's measured
      # total against its packed weight - is the same quantity on either, which
      # is what makes a pre-merge verdict worth having.
      # The check refuses a run missing a shard rather than judging a partial
      # lane, so this step is gated on the serial lane having succeeded: a
      # broken lane already reds CI and should not also fail here for having
      # left nothing complete to judge.
      - name: Check serial shard timings against the job cap and the hint table
        if: success() && needs.tests-portable-serial.result == 'success'
        run: |
          set -eu
          [ -f "$RUNNER_TEMP/fm-test/fm-test-timing-aggregate.json" ] || exit 0
          bin/fm-test-run.sh --check-lane-timing "$RUNNER_TEMP/fm-test/fm-test-timing-aggregate.json"
      - name: Upload aggregate timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm-test-timing-aggregate
          path: ${{ runner.temp }}/fm-test/fm-test-timing-aggregate.json
          if-no-files-found: warn

  # Stock-Bash lane. GitHub's Linux runners are Bash 5, so every construct that
  # only breaks on Bash 3.2 - the version macOS still ships as /bin/bash - is
  # invisible to every other job here. This lane exists to make that class fail
  # loudly, and it is only worth its name while it actually RUNS test code: a
  # `bash -n` parse sweep cannot see an unbound-variable expansion, so the parse
  # sweep below is a floor, not the coverage.
  # bin/fm-test-run.sh owns which tests this lane selects and names every test it
  # leaves out with the reason; docs/verification/stock-bash-lane.md records the
  # measurement behind those reasons and what this lane still cannot cover.
  macos-stock-bash:
    name: Stock macOS Bash 3.2 behavior lane
    runs-on: macos-latest
    # Budget, not a hang tripwire: the lane's per-script cost rule in
    # bin/fm-test-run.sh is what keeps it inside this wall clock, and macOS
    # runner minutes bill at ten times the Linux rate.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      # Pin ONLY Bash. The previous job restricted PATH to /bin:/usr/bin:... to
      # reach stock Bash, which also pinned every other tool to a macOS platform
      # binary - /usr/bin/python3 is 3.9 with no tomllib, and /usr/bin/jq is a
      # platform binary some guards specifically refuse. Tests then failed for
      # reasons that have nothing to do with the shell under test. A shim
      # directory in front of the runner's normal PATH varies the one thing this
      # lane is about and leaves every other tool modern.
      - name: Put stock /bin/bash in front of PATH
        run: |
          set -eu
          shim="$RUNNER_TEMP/stock-bash-bin"
          mkdir -p "$shim"
          ln -sf /bin/bash "$shim/bash"
          printf '%s\n' "$shim" >> "$GITHUB_PATH"
      # The lint suites need the repository's pinned linters, exactly as the
      # portable lanes install them; without these two the suites fail for a
      # missing tool rather than for anything about the shell under test.
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/fm-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install pinned actionlint
        run: |
          set -eu
          bin/fm-install-actionlint.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install tasks-axi
        run: |
          set -eu
          command -v npm >/dev/null || { echo "::error::npm is required to install tasks-axi"; exit 1; }
          npm install -g tasks-axi@0.2.5 >/dev/null
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
      # bin/fm-stock-bash-lane.sh owns everything this lane runs - the stock
      # Bash pin and its guards, the parse sweep, the selected tests with their
      # pinned case counts, and the retained public-followup regression - so a
      # local run before push executes exactly what this job executes.
      - name: Run the stock-bash lane under stock Bash
        shell: /bin/bash {0}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/fm-test"
          bin/fm-stock-bash-lane.sh --json "$RUNNER_TEMP/fm-test/fm-test-timing-stock-bash.json"
      - name: Upload stock-bash timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # The measured per-script durations the lane's cost exclusions are
          # justified against. Refresh that table from this artifact.
          name: fm-test-timing-stock-bash
          path: ${{ runner.temp }}/fm-test/fm-test-timing-stock-bash.json
          if-no-files-found: warn

  invariants:
    name: Repo invariants
    runs-on: ubuntu-latest
    # Hang tripwire: the invariant checks are seconds-long file comparisons.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Compatibility pointers must stay intact
        run: |
          set -eu
          [ ! -L CLAUDE.md ] || { echo "::error::CLAUDE.md must be a real @AGENTS.md pointer file, not a symlink"; exit 1; }
          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT
          printf '%s\n' \
            '<!-- Points Claude at AGENTS.md via import; edit AGENTS.md, not this file. -->' \
            '@AGENTS.md' >"$tmp"
          cmp -s CLAUDE.md "$tmp" || { echo "::error::CLAUDE.md must be the canonical @AGENTS.md pointer"; exit 1; }
          [ "$(readlink .claude/skills)" = "../.agents/skills" ] || { echo "::error::.claude/skills must be a symlink to ../.agents/skills"; exit 1; }
      - name: Personal fleet paths must not be tracked
        run: |
          set -eu
          tracked=$(git ls-files -- data state config projects .no-mistakes)
          if [ -n "$tracked" ]; then
            echo "::error::Personal fleet paths are tracked in git:"
            printf '%s\n' "$tracked"
            exit 1
          fi
